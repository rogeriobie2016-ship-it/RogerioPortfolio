:root{

}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;

}

/* ==========================================================
   6. CANVAS E UTILITÁRIOS DE DESENHO
   A arte vai para "buf" (baixa resolução) e é ampliada com pixel exato para a tela.

const $ = id => document.getElementById(id);

const H = TUNE.H, GY = H - TUNE.ground;
let W = 240;

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.floor(x),Math.floor(y),w,h); }
function hash(n){ const s=Math.sin(n*12.9898+78.233)*43758.5453; return s-Math.floor(s); }
function smooth(t){ return t<=0?0:t>=1?1:t*t*(3-2*t); }
const rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixCache=new Map();
function mix(a,b,k){
  k=Math.round(Math.max(0,Math.min(1,k))*32)/32; if(k===0) return a; if(k===1) return b;
  const key=a+b+k; let v=mixCache.get(key);
  if(!v){ const A=rgb(a),B=rgb(b); v='rgb('+Math.round(A[0]+(B[0]-A[0])*k)+','+Math.round(A[1]+(B[1]-A[1])*k)+','+Math.round(A[2]+(B[2]-A[2])*k)+')'; mixCache.set(key,v); }
  return v;
}
function line(x0,y0,x1,y1,c,t){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);t=t||1;
  const o=Math.floor(t/2); ctx.fillStyle=c;
  const dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1; let err=dx+dy;
  for(;;){ ctx.fillRect(x0-o,y0-o,t,t); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){err+=dy;x0+=sx;} if(e2<=dx){err+=dx;y0+=sy;} }
}
function ring(cx,cy,r,c){
  cx=Math.round(cx); cy=Math.round(cy); ctx.fillStyle=c; let x=r,y=0,err=1-r;
  while(x>=y){
    ctx.fillRect(cx+x,cy+y,1,1);ctx.fillRect(cx+y,cy+x,1,1);ctx.fillRect(cx-y,cy+x,1,1);ctx.fillRect(cx-x,cy+y,1,1);
    ctx.fillRect(cx-x,cy-y,1,1);ctx.fillRect(cx-y,cy-x,1,1);ctx.fillRect(cx+y,cy-x,1,1);ctx.fillRect(cx+x,cy-y,1,1);
    y++; if(err<0) err+=2*y+1; else { x--; err+=2*(y-x)+1; }
  }
}
function shapesO(list,fill,out){ for(const r of list) px(r[0]-1,r[1]-1,r[2]+2,r[3]+2,out); for(const r of list) px(r[0],r[1],r[2],r[3],fill); }
function drawChar(ch,x,y,c,s){
  const g=FONT[ACUTE[ch]||ch]; if(!g) return; ctx.fillStyle=c;
  for(let i=0;i<15;i++) if(g[i]==='#') ctx.fillRect(x+(i%3)*s,y+Math.floor(i/3)*s,s,s);
  if(ACUTE[ch]){ ctx.fillRect(x+2*s,y-2*s,s,s); ctx.fillRect(x+s,y-s,s,s); }
}
function drawText(str,x,y,c,s){ s=s||1; let cx=Math.round(x); for(const ch of str){ drawChar(ch,cx,Math.round(y),c,s); cx+=4*s; } }
function textW(str,s){ return [...str].length*4*(s||1)-(s||1); }
function tiles(cam,factor,spacing,fn){
  const off=Math.round(cam*factor), first=Math.floor(off/spacing)-2, last=Math.floor((off+W)/spacing)+1;
  for(let i=first;i<=last;i++) fn(i, i*spacing-off);
}
function makeSprite(rows,outline){
  const w=rows[0].length, h=rows.length, p=outline?1:0;
  const c=document.createElement('canvas'); c.width=w+p*2; c.height=h+p*2;
  const x=c.getContext('2d');
  if(outline){ x.fillStyle=COL.outline; for(let j=0;j<h;j++) for(let i=0;i<w;i++) if(rows[j][i]!=='.') x.fillRect(i,j,3,3); }
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){ const k=rows[j][i]; if(k!=='.'){ x.fillStyle=PAL[k]; x.fillRect(i+p,j+p,1,1); } }
  return c;
}
const SPR = {};
for(const k in SPR_ROWS) SPR[k]=makeSprite(SPR_ROWS[k], k==='head');
// Ícone ampliado (nítido) de um sprite, para o cartão de papel
const iconCache={};
function iconURL(name){
  if(iconCache[name]) return iconCache[name];
  const s=SPR[name], k=8, c=document.createElement('canvas'); c.width=s.width*k; c.height=s.height*k;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(s,0,0,c.width,c.height);
  return iconCache[name]=c.toDataURL();
}

/* Céu em faixas com dither */
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
let skyCache=[];
function buildSky(S){
  const c=document.createElement('canvas'); c.width=W; c.height=GY; const x=c.getContext('2d');
  const img=x.createImageData(W,GY), d=img.data, cols=S.bands.map(rgb), n=cols.length-1;
  const sx=Math.round(S.sun.x*W), sy=Math.round(S.sun.y*GY), sr=S.sun.r, sc=rgb(S.sun.c), hc=rgb(S.sun.halo);
  for(let y=0;y<GY;y++){
    const t=y/(GY-1)*n, i=Math.min(n-1,Math.floor(t)), f=t-i;
    for(let xx=0;xx<W;xx++){
      const th=(BAYER[(y&3)*4+(xx&3)]+.5)/16;
      let col=f>th?cols[i+1]:cols[i];
      if(S.stars&&y<GY*.7&&hash(xx*7.1+y*13.3)>.992) col=hash(xx+y)>.5?[239,235,228]:[242,196,106];
      const dist=Math.hypot(xx-sx,y-sy);
      if(dist<sr) col=sc; else if(dist<sr+4 && th<(sr+4-dist)/4*.7) col=hc;
      const o=(y*W+xx)*4; d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;
    }
  }
  x.putImageData(img,0,0); return c;
}

/* ==========================================================
   7. CENÁRIOS (parallax em camadas)
   ========================================================== */
const G = { t:0, k:0 };  // G.k = quanto a paisagem já mudou (0 a 1)

/* --- Fase 1: assentamento. Começa no pôr do sol, fica verde depois da escola --- */
function farSertao(cam){
  const k=G.k, bird=mix('#2A1A22','#F4F4EE',k);
  for(let j=0;j<3;j++){
    const bx=Math.round(W+40-((G.t*11+j*41)%(W+90))), by=Math.round(GY*.25+j*6+Math.sin(G.t*2+j)*2);
    const flap=Math.floor(G.t*6+j)%2;
    px(bx,by,1,1,bird); px(bx-1,by-flap,1,1,bird); px(bx+1,by-flap,1,1,bird);
  }
  const base=GY-8, c1=mix('#7A3E3A','#7FA35E',k), c2=mix('#5E2F30','#5A8A48',k);
  for(let sx=0;sx<W;sx++){ const wx=sx+Math.round(cam*.05);
    const h=Math.round(22+Math.sin(wx*.021)*7+Math.sin(wx*.047+2)*4+Math.sin(wx*.11)*1.5); px(sx,base-h,1,h,c1); }
  for(let sx=0;sx<W;sx++){ const wx=sx+Math.round(cam*.11);
    const h=Math.round(11+Math.sin(wx*.03+1)*5+Math.sin(wx*.08)*2); px(sx,base-h,1,h,c2); }
  px(0,GY-10,W,5,mix('#8A4A30','#7DA24F',k));
}
function mandacaru(x,base,h){
  const a=Math.round(base-h*.55), b=Math.round(base-h*.38);
  shapesO([[x,base-h,5,h],[x-5,a,6,4],[x-5,a-9,4,12],[x+4,b,6,4],[x+7,b-8,4,11]],'#5E7D3B','#2E3B20');
  px(x+1,base-h+1,1,h-2,'#7A9A4C'); px(x+3,base-h+2,1,h-3,'#476230');
  px(x-4,a-8,1,10,'#7A9A4C'); px(x+8,b-7,1,9,'#7A9A4C');
}
function casa(x,base,w,h){
  px(x,base-h,w,h,'#D8B387'); px(x+w-3,base-h,3,h,'#BF9669'); px(x,base-2,w,2,'#9C6A45');
  const d=x+Math.round(w*.28); px(d,base-9,5,9,'#3B2A21'); px(d+1,base-8,3,7,'#6B3E24');
  px(x+Math.round(w*.62),base-h+4,5,4,'#4E7B86'); px(x+Math.round(w*.62),base-h+4,5,1,'#2F4B52');
  for(let r=0;r<5;r++) px(x-2+r,base-h-1-r,w+4-2*r,1,r%2?'#A34E2E':'#8C4127');
  px(x-2,base-h,w+4,1,'#5E2A1A');
}
function juazeiro(x,base,lush){
  px(x,base-10,2,10,'#5A3D2A');
  shapesO([[x-7,base-19,16,6],[x-4,base-22,11,4],[x-9,base-16,20,3]],lush?'#5E9A3E':'#557336','#2E3B20');
  for(let i=0;i<14;i++) px(x-7+Math.floor(hash(x+i)*16),base-21+Math.floor(hash(i*3+x)*7),1,1,lush?'#7DBA52':'#3E5626');
}
function midSertao(cam){
  const base=GY-5;
  tiles(cam,.35,64,(i,x)=>{
    const r=hash(i*3.1), s=hash(i*7.7), ox=x+Math.floor(s*14);
    const lush=((i*64-W)/.35+W*.28)>SCHOOL_X;
    if(lush){ if(r<.22) casa(ox,base,24+Math.floor(s*10),14+Math.floor(s*5)); else if(r<.38) mandacaru(ox,base,24+Math.floor(s*16)); else if(r<.86) juazeiro(ox,base,true); }
    else { if(r<.30) casa(ox,base,24+Math.floor(s*10),14+Math.floor(s*5)); else if(r<.64) mandacaru(ox,base,24+Math.floor(s*16)); else if(r<.80) juazeiro(ox,base,false); }
  });
}
function nearSertao(cam){
  const base=GY-5, off=Math.round(cam*.72);
  for(let sx=0;sx<W;sx++){ const wx=sx+off; if(wx%3){ px(sx,base-9,1,1,'#3A2A22'); px(sx,base-5,1,1,'#3A2A22'); } }
  tiles(cam,.72,11,(i,x)=>{ if(i%2===0){ px(x,base-9,1,1,'#3A2A22'); px(x+1,base-10,1,1,'#3A2A22'); px(x-1,base-8,1,1,'#3A2A22'); } });
  tiles(cam,.72,22,(i,x)=>{ px(x,base-12,2,12,'#5E4030'); px(x,base-12,2,1,'#7A5540'); });
}
function escola(x,base){
  const w=64;

  const cx=Math.round(W/2), cy=30;
  for(let a=0;a<Math.PI*2;a+=Math.PI/8){ const r1=(Math.round(a*8/Math.PI)%2)?12:15;

  for(let dy=-6;dy<=6;dy++) for(let dx=-6;dx<=6;dx++){ const d=Math.hypot(dx,dy); if(d<6.5) px(cx+dx,cy+dy,1,1,d<4.5&&((dx+dy)&1)?paper:ink); }

  shapesO([[18,gy-20,4,20],[14,gy-13,5,3],[14,gy-19,3,8],[21,gy-10,5,3],[24,gy-16,3,8]],ink,ink);
  const rx=W-26; shapesO([[rx,gy-24,4,24],[rx-4,gy-15,5,3],[rx-4,gy-22,3,9],[rx+3,gy-12,5,3],[rx+6,gy-18,3,9]],ink,ink);
}

function knee(hx,hy,fx,fy,L1,L2){

}

const MELODY=[[0,76,2],[2,74,2],[4,72,2],[6,69,4],[12,72,2],[14,74,2],

const Sound={
  ctx:null,on:false,master:null,lp:null,noiseBuf:null,step:0,next:0,timer:0,
  enable(){

  },

function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const veh=()=>PHASES[G.phase].veh;

function buildPhase(i){
  const P=PHASES[i], r=rng(1000+i*77);
  G.phase=i; G.obstacles=[]; G.parts=[]; G.captureLit=false; G.stopped=0; G.flash=0; G.evo=null;
  G.boss=null; G.bossDone=false; G.hinted=false;

  G.items=P.items.map(it=>({x:Math.round(it.at*L),sprite:it.sprite,key:it.key,evolve:it.evolve,taken:false,flyT:0,bob:r()*6}));

    if(!G.items.some(it=>Math.abs(it.x-x)<56)) G.obstacles.push(Object.assign({type,x,yoff:0,dead:false,deadT:0},OBST[type]));
    x+=150+r()*95;
  }

function spawn(x,y,n,c,spread,up,life){

function startGame(){

function hitKey(o){ return o.type==='hole'?'hole'+G.phase : o.type==='cone'?'cone'+G.phase : o.type; }

function ride(dt,interactive,cruise){
  const b=G.bike;
  if(G.evo) G.slowMo=.18; else G.slowMo+=(1-G.slowMo)*Math.min(1,dt*2.6);
  if(b.hitT>0) b.hitT-=dt;
  let target=cruise!==undefined?cruise:TUNE.speed;
  if(b.hitT>TUNE.stumbleTime-.45) target*=.45;
  if(G.state==='ending'){ const stopX=L+50; target=Math.max(0,Math.min(TUNE.speed,(stopX-b.x)*1.3)); if(stopX-b.x<.6){ b.x=stopX; target=0; b.v=0; } }
  b.v+=(target-b.v)*Math.min(1,dt*5);
  const v=b.v*G.slowMo;
  b.x+=v*dt;
  b.buffer-=dt; b.coyote=b.onGround?.09:b.coyote-dt;
  if(b.buffer>0&&b.coyote>0){ b.vy=-TUNE.jump; b.onGround=false; b.buffer=0; b.coyote=0; Sound.jump(); spawn(b.x-6,GY-1,5,PHASES[G.phase].dust,40,30); }
  b.vy+=TUNE.gravity*dt*G.slowMo; b.y+=b.vy*dt*G.slowMo;
  if(b.y>=GY){ if(!b.onGround&&b.vy>200) spawn(b.x,GY-1,6,PHASES[G.phase].dust,60,25); b.y=GY; b.vy=0; b.onGround=true; }
  if(v>2){ b.frameT+=dt*(v/TUNE.speed); if(b.frameT>.08){ b.frameT=0; if(b.onGround||veh()!=='bike') b.frame=(b.frame+1)%3; } }
  b.wa+=v*dt/6;
  G.dustT-=dt;
  if(b.onGround&&v>25&&G.dustT<=0){ G.dustT=.08;
    if(veh()==='moto') spawn(b.x-15,GY-9,1,'#9A948C',16,14,.45); else spawn(b.x-15,GY-1,1,PHASES[G.phase].dust,14,10,.35); }
  G.auraT-=dt;
  if(G.powered&&G.auraT<=0){ G.auraT=.06;
    G.parts.push({x:b.x-12+Math.random()*4,y:b.y-6-Math.random()*22,vx:-20-Math.random()*20,vy:-10-Math.random()*15,life:.45,max:.45,c:Math.random()<.5?'#F2C46A':'#FFF1CF'}); }
  // monstros se mexem
  for(const o of G.obstacles){ if(!o.monster) continue;
    if(o.dead){ o.deadT+=dt; continue; }
    if(o.type==='rejected') o.x-=26*dt;
    else if(o.type==='deadline') o.yoff=-Math.round(Math.abs(Math.sin(G.t*5+o.x))*5);
    else o.yoff=-2-Math.round((Math.sin(G.t*3+o.x)+1)*1.5); }
  if(interactive){
    if(G.phase===3&&!G.hinted){ const m=G.obstacles.find(o=>o.monster&&!o.dead&&o.x>b.x); if(m&&m.x-b.x<W*.7){ G.hinted=true; showStamp(T().jumpOn,'',true,2.2); } }
    if(b.hitT<=0&&!G.evo) for(const o of G.obstacles){
      if(o.dead) continue;
      const over=b.x+11>o.x+2&&b.x-10<o.x+o.w-2, top=GY+o.yoff-o.h;
      if(o.monster&&over&&b.vy>0&&b.y<=top+7){   // pisou no monstro
        o.dead=true; b.vy=-260; b.onGround=false; Sound.stomp();
        spawn(o.x+o.w/2,top+4,14,'#C9B8E0',110,80,.5); showStamp(T().next,'',true,1);
        break;
      }
      let hit=false;
      if(o.type==='hole') hit=b.onGround&&b.x>o.x+4&&b.x<o.x+o.w-4;
      else hit=over&&b.y>top+2;
      if(hit){ hurtPlayer(hitKey(o)); break; }
    }
    for(const it of G.items){
      if(!it.taken&&Math.abs(it.x-b.x)<14){
        it.taken=true; G.found++; G.lives=Math.min(3,G.lives+1); G.slowMo=.35;
        G.toastItem=it; G.toastT=TUNE.toastTime; G.toastDelay=it.evolve?TUNE.evolveTime+.2:0; G.toastBuilt=false;
        for(let k=0;k<14;k++) spawn(it.x,GY-28,1,k%2?'#D9973F':'#EFEBE4',90,70,.6);
        if(it.evolve){ G.evo={t:0,to:it.evolve}; Sound.evolve(); } else Sound.collect();
      }
    }
  }
  for(const it of G.items) if(it.taken) it.flyT+=dt;
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; p.life-=dt; }
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.shake>0) G.shake-=dt;

}

function startBoss(){
  const b=G.bike;
  G.boss={x:b.x+W+40,hp:3,st:'enter',t:0,fails:0,hurtT:0,shots:[],thrown:false};
  showStamp(T().boss,T().bossHint,false,3.2); Sound.roar();
}
function updateBoss(dt){
  const B=G.boss, b=G.bike; if(!B) return;
  B.t+=dt; if(B.hurtT>0) B.hurtT-=dt;
  const idleX=b.x+Math.round(W*.52), top=GY-30;
  for(const p of B.shots) p.x+=p.vx*dt;
  B.shots=B.shots.filter(p=>p.x>b.x-W);
  if(b.hitT<=0) for(const p of B.shots){ if(!p.hit&&Math.abs(p.x-b.x)<9&&b.y>GY-6){ p.hit=true; hurtPlayer('rejected'); } }
  switch(B.st){
    case 'enter': B.x+=(idleX-B.x)*Math.min(1,dt*2.2); if(B.t>1.6){ B.st='idle'; B.t=0; B.thrown=false; } break;
    case 'idle': {
      B.x+=(idleX-B.x)*Math.min(1,dt*4);
      if(B.hp<3&&!B.thrown&&B.t>.35){ B.thrown=true; B.shots.push({x:B.x-16,vx:-120}); Sound.throw(); }
      if(B.t>[.8,1,1.2][B.hp-1]){ B.st='charge'; B.t=0; }
      break; }
    case 'charge': {
      B.x-=(B.fails>=2?58:82+(3-B.hp)*14)*dt;
      const dx=Math.abs(B.x-b.x);
      if(b.vy>0&&dx<18&&b.y>=top-6&&b.y<=top+12){
        B.hp--; B.hurtT=.7; b.vy=-300; b.onGround=false; G.shake=.35; Sound.bossHit(); spawn(B.x,top,16,'#EFEBE4',120,90);
        if(B.hp<=0){ B.st='dead'; B.t=0; } else { B.st='hurt'; B.t=0; showStamp(T().next,'',true,1.1); }
      } else if(dx<16&&b.y>top+12&&b.hitT<=0){ hurtPlayer('boss'); B.fails++; B.st='retreat'; B.t=0; }
      else if(B.x<b.x-24){ B.fails++; B.st='retreat'; B.t=0; }
      break; }
    case 'hurt': case 'retreat':
      B.x+=(idleX-B.x)*Math.min(1,dt*3); if(B.t>.8){ B.st='idle'; B.t=0; B.thrown=false; } break;
    case 'dead':
      if(Math.random()<.8) spawn(B.x+(Math.random()-.5)*24,GY-14-Math.random()*16,1,Math.random()<.5?'#EFEBE4':'#D9973F',120,100,.6);
      if(B.t>1){ G.items.push({x:Math.round(b.x+120),sprite:'offer',key:'offer',taken:false,flyT:0,bob:0}); G.boss=null; G.bossDone=true; Sound.bossDie(); G.flash=.5; }
      break;
  }
}

function update(dt){
  G.t+=dt; G.stateT+=dt;
  if(G.toastDelay>0) G.toastDelay-=dt; else if(G.toastT>0) G.toastT-=dt;
  if(G.stampT>0) G.stampT-=dt;
  if(G.flash>0) G.flash-=dt*1.6;
  G.logoA = G.state==='title' ? Math.min(1,G.logoA+dt*2) : Math.max(0,G.logoA-dt*3);
  if(G.evo){
    G.evo.t+=dt;
    const b=G.bike;
    if(Math.random()<.7) G.parts.push({x:b.x-6+Math.random()*12,y:b.y-4-Math.random()*20,vx:0,vy:-30-Math.random()*40,life:.7,max:.7,c:Math.random()<.5?'#D9973F':'#EFEBE4'});
    if(G.evo.t>=TUNE.evolveTime){
      G.outfit=applyEvo(G.outfit,G.evo.to); G.powered=true;
      G.flash=.6; for(let k=0;k<24;k++) spawn(b.x,b.y-16,1,k%2?'#D9973F':'#FFF1CF',140,90,.7);
      G.evo=null;
    }
  }
  const bx=G.bike.x;
  if(G.state==='title') G.k=0;
  else if(G.phase===0) G.k=smooth((bx-(SCHOOL_X-30))/300);
  else if(G.phase===2) G.k=smooth((bx-L*.38)/(L*.34));
  else if(G.phase===3) G.k=1;
  else G.k=0;

  switch(G.state){
    case 'title': G.phase=0; G.veil=Math.max(0,G.veil-dt*1.5); ride(dt,false,40); break;
    case 'fadeout':
      ride(dt,false,G.phase===0&&G.next===0?40:undefined);
      G.veil=Math.min(1,G.stateT/.7);
      if(G.stateT>=.7){ G.veil=1; buildPhase(G.next); ui.title.hidden=true; G.toastT=0; G.stampT=0; showCard(G.next); setState('card'); }
      break;
    case 'card': {
      const Tt=TUNE.cardTime, t=G.stateT;
      G.veil = t<.3 ? 1-t/.3 : t>Tt-.3 ? Math.min(1,(t-(Tt-.3))/.3) : 0;
      if(t>=Tt){ G.veil=1; setState('fadein'); }
      break; }
    case 'fadein':
      ride(dt,true); G.veil=Math.max(0,1-G.stateT/.6);
      if(G.stateT>=.6) setState('play'); break;
    case 'play':
      ride(dt,true);
      if(G.phase<2&&G.bike.x>=L){ G.next=G.phase+1; setState('fadeout'); }
      else if(G.phase===2&&G.bike.x>=L-330) setState('ending');
      else if(G.phase===3&&G.bike.x>=BOSS_X){ setState('boss'); startBoss(); }
      break;
    case 'ending':   // fim de LA: para no estúdio e vira holograma
      ride(dt,false);
      if(G.bike.v<1){ G.stopped+=dt;
        if(G.stopped>.45&&!G.captureLit){ G.captureLit=true; G.flash=1; G.evo={t:0,to:'holo'}; Sound.evolve(); }
        if(G.stopped>.45+TUNE.evolveTime+1.2){ G.next=3; setState('fadeout'); } }
      break;
    case 'boss':
      ride(dt,true,G.bossDone?TUNE.speed*.55:0); updateBoss(dt);
      if(G.bossDone&&G.items.some(i=>i.key==='offer'&&i.taken)) setState('finale');
      break;
    case 'finale':
      ride(dt,false,0);
      if(G.stateT>TUNE.toastTime+.4){ setState('endcard'); ui.end.classList.add('on'); }
      break;
    case 'endcard':
      G.veil=Math.min(.86,G.stateT/1); ride(dt,false); break;
  }
}

const LOGO_SHADE=['#FFF6E0','#F9DD98','#F2C46A','#D9973F','#B8772E'];
function drawLogo(al){
  ctx.globalAlpha=al;
  const t=G.t, s=W>=200?5:4, top=T().logoTop, x1=Math.round((W-textW(top,s))/2), y1=4+2*s;
  const chars=[...top], pos=chars.map((ch,j)=>[x1+j*4*s, y1+Math.round(Math.sin(t*2.2+j*.7)*1.5)]);
  const cellsOf=ch=>{ const g=FONT[ACUTE[ch]||ch], out=[]; if(!g) return out; for(let i=0;i<15;i++) if(g[i]==='#') out.push([i%3,Math.floor(i/3)]); if(ACUTE[ch]) out.push([2,-2],[1,-1]); return out; };
  for(let pass=0;pass<3;pass++) chars.forEach((ch,j)=>{ const lx=pos[j][0], ly=pos[j][1];
    for(const [cx,cy] of cellsOf(ch)){ const X=lx+cx*s, Y=ly+cy*s;
      if(pass===0){ px(X+1,Y+2,s,s,'#7A3A22'); px(X+2,Y+3,s,s,'#4A1C16'); }
      else if(pass===1) px(X-1,Y-1,s+2,s+2,'#1D1714');

  const s2=2, bot=T().logoBottom, bw=textW(bot,s2)+14, bh=5*s2+6, bx=Math.round((W-bw)/2), by=y1+5*s+7;
  px(bx-9,by+3,11,bh,'#1D1714'); px(bx-8,by+4,9,bh-2,'#9C6A2A');
  px(bx+bw-2,by+3,11,bh,'#1D1714'); px(bx+bw-1,by+4,9,bh-2,'#9C6A2A');
  px(bx-1,by-1,bw+2,bh+2,'#1D1714'); px(bx,by,bw,bh,'#D9973F'); px(bx,by,bw,1,'#F9DD98'); px(bx,by+bh-1,bw,1,'#9C6A2A');
  drawText(bot,bx+7,by+3+(/[ÁÉÍÓÚ]/.test(bot)?1:0),'#1D1714',s2);

  ctx.globalAlpha=1;
}
function draw(){
  if(G.state==='card'){ CARD_BG[G.phase](G.stateT); return; }
  const P=PHASES[G.phase], sk=skyCache[G.phase];
  ctx.drawImage(sk[0],0,0);
  if(sk[1]&&G.k>0){ ctx.globalAlpha=G.k; ctx.drawImage(sk[1],0,0); ctx.globalAlpha=1; }

  for(const o of G.obstacles){ if(o.type!=='hole') continue; const sx=o.x-cam; if(sx<-30||sx>W+10) continue;
    px(sx+1,GY-4,o.w-2,1,P.holeLip); px(sx,GY-3,o.w,5,'#1D1714'); px(sx+2,GY+2,o.w-4,1,'#1D1714'); px(sx+2,GY-2,o.w-5,1,'#2E2420'); }
  if(G.phase===2) drawCaptureStage(L-cam);

    if(o.dead){ if(o.deadT>.25) continue; const s=SPR[o.type]; ctx.globalAlpha=1-o.deadT/.25; ctx.drawImage(s,0,0,s.width,s.height,sx-1,GY-3,s.width+2,4); ctx.globalAlpha=1; continue; }
    if(o.type==='cactus') shapesO([[sx+3,GY-12,3,12],[sx,GY-8,3,2],[sx,GY-11,2,4],[sx+6,GY-6,3,2],[sx+7,GY-9,2,4]],'#5E7D3B','#2E3B20');
    else { const s=SPR[o.type]; ctx.drawImage(s,sx,GY-s.height+1+(o.yoff||0)); }
  }
  if(G.boss){ const B=G.boss;
    for(const p of B.shots){ const sx=Math.round(p.x-cam); px(sx-4,GY-7,9,7,COL.outline); px(sx-3,GY-6,7,5,COL.ink); px(sx-1,GY-5,3,2,'#C9603F'); }

    ctx.globalAlpha=1; }

    else for(let k=0;k<4;k++){ const a=G.t*2.4+k*Math.PI/2; px(sx+Math.cos(a)*10,y+Math.sin(a)*9,1,1,k%2?'#D9973F':'#F2C46A'); }
    ctx.drawImage(s,Math.round(sx-s.width/2),Math.round(y-s.height/2));
    ctx.globalAlpha=1;
  }
  const b=G.bike, bx=b.x-cam;
  let outfit=G.outfit;
  if(G.evo){
    const e=G.evo.t/TUNE.evolveTime, fade=1-e*.6;
    ctx.globalAlpha=.22*fade; px(bx-8,0,16,GY,'#EFEBE4'); ctx.globalAlpha=.35*fade; px(bx-3,0,6,GY,'#D9973F'); ctx.globalAlpha=1;
    ring(bx,b.y-16,Math.round(4+e*26),'#F2C46A'); ring(bx,b.y-16,Math.round(2+e*16),'#EFEBE4');
    if(e>.85||Math.sin(G.evo.t*G.evo.t*22)>0) outfit=applyEvo(G.outfit,G.evo.to);
  }
  let alpha=1; if(b.hitT>0&&Math.floor(b.hitT*14)%2===0) alpha=.35;
  const jitter=b.hitT>TUNE.stumbleTime-.3?Math.round(Math.sin(G.t*60)):0;
  (outfit.holo?drawHolo:drawRider)(bx,b.y+jitter,b.frame,b.wa,alpha,outfit,veh());
  for(const p of G.parts){ ctx.globalAlpha=Math.max(0,p.life/p.max); px(p.x-cam,p.y,1,1,p.c); }
  ctx.globalAlpha=1;
  if(G.logoA>0&&G.phase===0) drawLogo(G.logoA);
  if(G.flash>0){ ctx.globalAlpha=Math.min(1,G.flash)*.7; px(0,0,W,H,'#EFEBE4'); ctx.globalAlpha=1; }
}

  toast:$('toast'), toastTag:$('toastTag'), toastSay:$('toastSay'), toastSr:$('toastSr'), toastIcon:$('toastIcon'),
  stamp:$('stamp'), stampText:$('stampText'), stampSmall:$('stampSmall'),
  hud:$('hud'), hHearts:$('hHearts'), hItems:$('hItems'), hKm:$('hKm'),
  bossbar:$('bossbar'), bossName:$('bossName'), bossPips:[...document.querySelectorAll('#bossbar i')],
  progress:$('progress'), bar:document.querySelector('#progress b'), sound:$('sound'), enter:$('enterBtn'),
  play:$('playBtn'), menuSound:$('menuSound'), skip:$('skipBtn'), langs:[...document.querySelectorAll('.lbtn')]
};
function showCard(i){
  const [t,s]=T().cards[i];
  ui.card.className='layer c'+i;
  ui.cardT.textContent='';
  [...t].forEach((ch,j)=>{ const sp=document.createElement('span'); sp.textContent=ch===' '?' ':ch; sp.style.animationDelay=(120+j*45)+'ms'; ui.cardT.appendChild(sp); });
  ui.cardS.textContent=s; ui.cardN.textContent=(i+1)+' / 4';
}
function buildSay(el,text){
  el.textContent=''; let hl=false, i=0;
  for(const raw of text.split(' ')){
    let w=raw, end=false;
    if(w.startsWith('*')){ hl=true; w=w.slice(1); }
    if(w.includes('*')){ end=true; w=w.replace('*',''); }
    const sp=document.createElement('span'); sp.textContent=w; if(hl) sp.className='hl'; sp.style.animationDelay=(200+i*75)+'ms';
    el.appendChild(sp); el.appendChild(document.createTextNode(' ')); i++; if(end) hl=false;
  }
}
function soundLabel(on){ return T().sound+': '+(on?T().on:T().off); }
function applyLang(l){
  LANG=l; const s=T(); document.documentElement.lang=l;
  $('titleText').textContent=s.title; $('titleHint').textContent=s.hint;
  ui.play.innerHTML='<span>&#9654;</span> '; ui.play.append(s.play);
  ui.skip.textContent=s.skip; ui.menuSound.textContent=soundLabel(Sound.on);
  ui.sound.querySelector('span').textContent=Sound.on?s.soundOn:s.soundOff;
  $('endText').textContent=s.endLine; ui.enter.textContent=s.endButton;
  ui.bossName.textContent=s.boss;
  ui.langs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l?'true':'false'));
}
let lastUI={};
function syncUI(){
  const set=(k,el,prop,v)=>{ if(lastUI[k]!==v){ lastUI[k]=v; el.style[prop]=v; } };
  const txt=(k,el,v)=>{ if(lastUI[k]!==v){ lastUI[k]=v; el.textContent=v; } };
  set('veil',ui.veil,'opacity',G.veil.toFixed(3));
  let co=0; if(G.state==='card'){ const t=G.stateT; co=t<.3?t/.3:t>TUNE.cardTime-.3?Math.max(0,(TUNE.cardTime-t)/.3):1; }
  set('card',ui.card,'opacity',co.toFixed(3));
  const playing=['play','fadein','ending','boss','finale'].includes(G.state);
  set('prog',ui.progress,'opacity',playing?'1':'0');
  set('hud',ui.hud,'opacity',playing?'1':'0');
  set('bar',ui.bar,'width',(Math.min(1,(G.phase+Math.min(1,G.bike.x/L))/4)*100).toFixed(1)+'%');
  txt('hearts',ui.hHearts,'♥'.repeat(G.lives)+'♡'.repeat(3-G.lives));
  if(lastUI.found!==G.found){ lastUI.found=G.found; ui.hItems.innerHTML='<b>&#9670;</b> '+G.found+'/'+TOTAL_ITEMS; }
  const P=PHASES[G.phase];
  txt('km',ui.hKm,'KM '+Math.floor(P.km[0]+(P.km[1]-P.km[0])*Math.min(1,Math.max(0,G.bike.x/L))).toLocaleString(LANG==='en'?'en-US':'pt-BR'));
  const B=G.boss;
  set('boss',ui.bossbar,'opacity',B&&B.st!=='dead'?'1':'0');
  if(B){ const hp=Math.max(0,B.hp); if(lastUI.hp!==hp){ lastUI.hp=hp; ui.bossPips.forEach((p,i)=>p.classList.toggle('off',i>=hp)); } }
  // cartão de papel do item
  const show=G.toastT>0&&G.toastDelay<=0&&playing&&G.toastItem;
  if(show&&!G.toastBuilt){
    const it=G.toastItem, [tag,text]=T().items[it.key];
    ui.toastIcon.src=iconURL(it.sprite); ui.toastTag.textContent=tag; buildSay(ui.toastSay,text);
    ui.toastSr.textContent=text.replace(/\*/g,''); G.toastBuilt=true;
  }
  if(lastUI.toast!==!!show){ lastUI.toast=!!show; ui.toast.classList.toggle('show',!!show); }
  const st=G.stampT>0&&playing;
  if(lastUI.stamp!==st||st&&!ui.stamp.classList.contains('show')){ lastUI.stamp=st; ui.stamp.classList.toggle('show',st); }
}

function press(){
  if(G.state==='title'){ startGame(); return; }
  if(['play','fadein','boss'].includes(G.state)) G.bike.buffer=.14;
  else if(G.state==='endcard'&&G.stateT>1) startGame();
}
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    const a=document.activeElement; if(a&&a.tagName==='BUTTON') return;
    e.preventDefault(); if(!e.repeat) press();
  }
});
$('app').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; e.preventDefault(); press(); });
ui.enter.addEventListener('click',()=>{ location.href='index.html?from=game'; });
function toggleSound(e){
  const on=Sound.on?(Sound.disable(),false):Sound.enable();
  ui.sound.setAttribute('aria-pressed',on?'true':'false');
  ui.sound.querySelector('span').textContent=on?T().soundOn:T().soundOff;
  ui.menuSound.textContent=soundLabel(on);
  if(e&&e.currentTarget===ui.sound) ui.sound.blur();
}
ui.sound.addEventListener('click',toggleSound);
ui.menuSound.addEventListener('click',toggleSound);
ui.play.addEventListener('click',()=>{ if(G.state==='title') startGame(); });
ui.skip.addEventListener('click',()=>{   // pula direto para a tela final
  if(G.state!=='title') return;
  ui.title.style.opacity=0; ui.title.hidden=true; setState('endcard'); ui.end.classList.add('on');
});
ui.langs.forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.l)));

function resize(){
  const vw=window.innerWidth, vh=window.innerHeight, dpr=Math.max(1,window.devicePixelRatio||1);
  W=Math.max(180,Math.min(300,Math.round(H*vw/vh)));
  buf.width=W; buf.height=H; ctx.imageSmoothingEnabled=false;
  const s=Math.min((vw-32)/W,(vh-64)/H);
  const dev=Math.floor(s*dpr);                       // pixels reais por pixel de arte (inteiro = nítido)
  const cssS=dev>=2?dev/dpr:s;
  const cw=Math.round(W*cssS), ch=Math.round(H*cssS);
  stage.style.width=cw+'px'; stage.style.height=ch+'px';
  screen.width=Math.round(cw*dpr); screen.height=Math.round(ch*dpr);
  sctx.imageSmoothingEnabled=false;
  stage.style.setProperty('--u',(cw/100).toFixed(2)+'px');
  skyCache=PHASES.map(P=>P.skies.map(buildSky));
  G.camX=G.bike.x-W*.28;
}
window.addEventListener('resize',resize);

(function grain(){
  const c=document.createElement('canvas'); c.width=c.height=96; const x=c.getContext('2d'), img=x.createImageData(96,96);
  for(let i=0;i<96*96;i++){ const v=Math.random()>.5?235:10; img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v; img.data[i*4+3]=Math.floor(Math.random()*110); }
  x.putImageData(img,0,0); $('grain').style.backgroundImage='url('+c.toDataURL()+')';
})();

applyLang(LANG);
resize();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>.05) dt=.05; if(dt<0) dt=0;
  update(dt); draw();
  sctx.imageSmoothingEnabled=false; sctx.drawImage(buf,0,0,screen.width,screen.height);
  syncUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

</body></html>
